[project]
name = "bench-eval"
version = "0.1.0"
description = "Evaluation tooling for FaaS benchmark results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "polars>=1.30.0",
]

[project.scripts]
bench-eval = "bench_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
