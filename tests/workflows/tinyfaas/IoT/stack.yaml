provider:
  name: tinyfaas
  gateway: ${TINYFAAS_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  iot-i:
    lang: nodejs
    handler: ./I
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-as:
    lang: nodejs
    handler: ./AS
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
  iot-ca:
    lang: nodejs
    handler: ./CA
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-cs:
    lang: nodejs
    handler: ./CS
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-csa:
