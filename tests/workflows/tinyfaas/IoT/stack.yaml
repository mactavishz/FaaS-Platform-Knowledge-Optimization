    handler: ./CSA
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
  iot-csl:
    lang: nodejs
    handler: ./CSL
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
  iot-ct:
    lang: nodejs
    handler: ./CT
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-cw:
    lang: nodejs
    handler: ./CW
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-dj:
    lang: nodejs
    handler: ./DJ
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
  iot-se:
    lang: nodejs
    handler: ./SE
