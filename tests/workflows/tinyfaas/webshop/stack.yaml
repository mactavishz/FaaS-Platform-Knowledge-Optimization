provider:
  name: tinyfaas
  gateway: ${TINYFAAS_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  webshop-frontend:
    lang: nodejs
    handler: ./frontend
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-checkout:
    lang: nodejs
    handler: ./checkout
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-addcartitem:
    lang: nodejs
    handler: ./addcartitem
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-emptycart:
    lang: nodejs
    handler: ./emptycart
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-getcart:
    lang: nodejs
    handler: ./getcart
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-cartstorage:
    lang: nodejs
    handler: ./cartstorage
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
  webshop-listproducts:
    lang: nodejs
    handler: ./listproducts
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-getproduct:
    lang: nodejs
    handler: ./getproduct
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-searchproducts:
    lang: nodejs
    handler: ./searchproducts
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-listrecommendations:
    lang: nodejs
    handler: ./listrecommendations
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-currency:
    lang: nodejs
    handler: ./currency
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-supportedcurrencies:
    lang: nodejs
    handler: ./supportedcurrencies
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-getads:
    lang: nodejs
    handler: ./getads
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-shipmentquote:
    lang: nodejs
    handler: ./shipmentquote
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-shiporder:
    lang: nodejs
    handler: ./shiporder
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-payment:
    lang: nodejs
    handler: ./payment
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-email:
    lang: nodejs
    handler: ./email
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
