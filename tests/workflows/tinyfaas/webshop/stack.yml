    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-getads:
    lang: nodejs
    handler: ./getads
    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-shipmentquote:
    lang: nodejs
    handler: ./shipmentquote
    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-shiporder:
    lang: nodejs
    handler: ./shiporder
    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-payment:
    lang: nodejs
    handler: ./payment
    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-email:
