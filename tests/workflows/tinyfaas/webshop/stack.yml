    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-getcart:
    lang: nodejs
    handler: ./getcart
    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-cartstorage:
    lang: nodejs
    handler: ./cartstorage
    limits:
      cpu: 0.25
      memory: 256Mi
    environment_file:
      - .env.yaml
  webshop-listproducts:
    lang: nodejs
    handler: ./listproducts
    limits:
      cpu: 0.25
      memory: 256Mi
  webshop-getproduct:
    lang: nodejs
