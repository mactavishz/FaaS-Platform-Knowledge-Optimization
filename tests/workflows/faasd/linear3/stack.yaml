version: 1.0
provider:
  name: openfaas
  gateway: ${FAASD_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  linear3-a:
    lang: python3
    handler: ./a
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd/}linear3-a:latest
    build_args:
      TEST_ENABLED: false
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  linear3-b:
    lang: python3
    handler: ./b
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd/}linear3-b:latest
    build_args:
      TEST_ENABLED: false
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  linear3-c:
    lang: python3
    handler: ./c
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd/}linear3-c:latest
    build_args:
      TEST_ENABLED: false
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
configuration:
  templates:
    - name: python3
      source: https://github.com/mactavishz/faas-templates