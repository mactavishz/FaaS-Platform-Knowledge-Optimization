version: 1.0
provider:
  name: openfaas
  gateway: ${FAASD_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  linear2-a:
    lang: python3-http
    handler: ./a
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/linear2-a:latest
    build_args:
      TEST_ENABLED: false
    limits:
      cpu: 0.25
      memory: 256Mi
  linear2-b:
    lang: python3-http
    handler: ./b
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/linear2-b:latest
    build_args:
      TEST_ENABLED: false
    limits:
      cpu: 0.25
      memory: 256Mi
