version: 1.0
provider:
  name: openfaas
  gateway: ${FAASD_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  iot-i:
    lang: node22
    handler: ./I
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-i:latest
    limits:
      cpu: 0.25
      memory: 256Mi
  iot-as:
    lang: node22
    handler: ./AS
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-as:latest
    limits:
      cpu: 0.25
      memory: 256Mi
    environment_file:
      - .env.yaml
  iot-ca:
    lang: node22
    handler: ./CA
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-ca:latest
    limits:
      cpu: 0.25
      memory: 256Mi
  iot-cs:
    lang: node22
    handler: ./CS
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-cs:latest
    limits:
      cpu: 0.25
      memory: 256Mi
  iot-csa:
    lang: node22
    handler: ./CSA
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-csa:latest
    limits:
      cpu: 0.25
      memory: 256Mi
    environment_file:
      - .env.yaml
  iot-csl:
    lang: node22
    handler: ./CSL
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-csl:latest
    limits:
      cpu: 0.25
      memory: 256Mi
    environment_file:
      - .env.yaml
  iot-ct:
    lang: node22
    handler: ./CT
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-ct:latest
    limits:
      cpu: 0.25
      memory: 256Mi
  iot-cw:
    lang: node22
    handler: ./CW
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-cw:latest
    limits:
      cpu: 0.25
      memory: 256Mi
  iot-dj:
    lang: node22
    handler: ./DJ
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-dj:latest
    limits:
      cpu: 0.25
      memory: 256Mi
    environment_file:
      - .env.yaml
  iot-se:
    lang: node22
    handler: ./SE
    image: ${REGISTRY_PREFIX:-registry.local:5050/faasd}/iot-se:latest
    limits:
      cpu: 0.25
      memory: 256Mi
    environment_file:
      - .env.yaml
