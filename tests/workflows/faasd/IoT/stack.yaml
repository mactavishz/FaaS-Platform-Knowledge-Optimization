version: 1.0
provider:
  name: openfaas
  gateway: ${FAASD_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  iot-i:
    lang: node24
    handler: ./I
    image: ./dist/iot-i.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-as:
    lang: node24
    handler: ./AS
    image: ./dist/iot-as.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment_file:
      - .env.yaml
  iot-ca:
    lang: node24
    handler: ./CA
    image: ./dist/iot-ca.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-cs:
    lang: node24
    handler: ./CS
    image: ./dist/iot-cs.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-csa:
    lang: node24
    handler: ./CSA
    image: ./dist/iot-csa.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment_file:
      - .env.yaml
  iot-csl:
    lang: node24
    handler: ./CSL
    image: ./dist/iot-csl.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment_file:
      - .env.yaml
  iot-ct:
    lang: node24
    handler: ./CT
    image: ./dist/iot-ct.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-cw:
    lang: node24
    handler: ./CW
    image: ./dist/iot-cw.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  iot-dj:
    lang: node24
    handler: ./DJ
    image: ./dist/iot-dj.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment_file:
      - .env.yaml
  iot-se:
    lang: node24
    handler: ./SE
    image: ./dist/iot-se.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment_file:
      - .env.yaml
configuration:
  templates:
    - name: node24
      source: https://github.com/mactavishz/faas-templates