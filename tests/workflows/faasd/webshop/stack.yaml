version: 1.0
provider:
  name: openfaas
  gateway: ${FAASD_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  webshop-frontend:
    lang: node24
    handler: ./frontend
    image: ./dist/webshop-frontend.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-checkout:
    lang: node24
    handler: ./checkout
    image: ./dist/webshop-checkout.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-addcartitem:
    lang: node24
    handler: ./addcartitem
    image: ./dist/webshop-addcartitem.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-emptycart:
    lang: node24
    handler: ./emptycart
    image: ./dist/webshop-emptycart.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-getcart:
    lang: node24
    handler: ./getcart
    image: ./dist/webshop-getcart.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-cartstorage:
    lang: node24
    handler: ./cartstorage
    image: ./dist/webshop-cartstorage.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
  webshop-listproducts:
    lang: node24
    handler: ./listproducts
    image: ./dist/webshop-listproducts.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-getproduct:
    lang: node24
    handler: ./getproduct
    image: ./dist/webshop-getproduct.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-searchproducts:
    lang: node24
    handler: ./searchproducts
    image: ./dist/webshop-searchproducts.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-listrecommendations:
    lang: node24
    handler: ./listrecommendations
    image: ./dist/webshop-listrecommendations.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-currency:
    lang: node24
    handler: ./currency
    image: ./dist/webshop-currency.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-supportedcurrencies:
    lang: node24
    handler: ./supportedcurrencies
    image: ./dist/webshop-supportedcurrencies.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-getads:
    lang: node24
    handler: ./getads
    image: ./dist/webshop-getads.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-shipmentquote:
    lang: node24
    handler: ./shipmentquote
    image: ./dist/webshop-shipmentquote.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-shiporder:
    lang: node24
    handler: ./shiporder
    image: ./dist/webshop-shiporder.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-payment:
    lang: node24
    handler: ./payment
    image: ./dist/webshop-payment.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
  webshop-email:
    lang: node24
    handler: ./email
    image: ./dist/webshop-email.tar
    platforms: linux/amd64,linux/arm64
    limits:
      cpu: ${WORKFLOW_CPU_LIMIT:-0.25}
      memory: ${WORKFLOW_MEMORY_LIMIT:-256Mi}
configuration:
  templates:
    - name: node24
      source: https://github.com/mactavishz/faas-templates
